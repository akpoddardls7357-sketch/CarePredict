      - name: OCR to Prediction to SHAP test
        env:
          API_URL: https://carepredict-api.onrender.com
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import requests

          API_URL = os.environ["API_URL"]

          print("=" * 60)
          print("CARE PREDICT END-TO-END SYSTEM TEST")
          print("=" * 60)

          # ==================================================
          # STEP 1: OCR / UPLOAD
          # ==================================================

          print("\n[1/3] Testing OCR / upload...")

          image_path = (
              "test/fixtures/"
              "CarePredict_Test_A_Clinic_Intake.png"
          )

          upload_result = None

          # Render can take some time to process OCR.
          # Retry temporary gateway/server failures.
          max_attempts = 3

          for attempt in range(1, max_attempts + 1):

              print(
                  f"\nOCR attempt {attempt}/{max_attempts}..."
              )

              try:

                  with open(image_path, "rb") as image:

                      response = requests.post(
                          f"{API_URL}/upload",
                          files={
                              "file": (
                                  "CarePredict_Test_A_Clinic_Intake.png",
                                  image,
                                  "image/png"
                              )
                          },
                          timeout=180
                      )

                  print(
                      f"Upload HTTP status: "
                      f"{response.status_code}"
                  )

                  if response.status_code == 200:
                      upload_result = response.json()
                      break

                  print(
                      "Upload did not succeed."
                  )

                  if response.status_code >= 500:
                      print(
                          "Temporary server/gateway error. "
                          "Waiting before retry..."
                      )
                      time.sleep(15)
                      continue

                  response.raise_for_status()

              except requests.exceptions.RequestException as e:

                  print(
                      f"Upload request failed: {e}"
                  )

                  if attempt < max_attempts:
                      print(
                          "Waiting 15 seconds before retry..."
                      )
                      time.sleep(15)
                  else:
                      print(
                          "All OCR attempts failed."
                      )
                      raise

          if upload_result is None:
              print(
                  "\nERROR: OCR/upload failed after "
                  f"{max_attempts} attempts."
              )
              sys.exit(1)

          print("\nUpload response received.")

          print(
              "Extraction method:",
              upload_result.get("extraction_method")
          )

          print(
              "Text length:",
              upload_result.get("text_length")
          )

          patient = upload_result.get("patient_data")

          if not patient:
              print(
                  "\nERROR: OCR did not return patient_data."
              )

              print("Response:")
              print(upload_result)

              sys.exit(1)

          print(
              "OCR / field extraction PASSED."
          )

          print(
              "Extracted fields:",
              len(patient)
          )

          # ==================================================
          # STEP 2: PREDICTION
          # ==================================================

          print("\n[2/3] Testing prediction...")

          response = requests.post(
              f"{API_URL}/predict",
              json={
                  "patient": patient
              },
              timeout=120
          )

          response.raise_for_status()

          prediction = response.json()

          print(
              "Prediction response received."
          )

          risk_probability = prediction.get(
              "risk_probability"
          )

          risk_level = prediction.get(
              "risk_level"
          )

          if risk_probability is None:
              print(
                  "\nERROR: risk_probability missing."
              )

              print("Response:")
              print(prediction)

              sys.exit(1)

          print(
              f"Risk probability: "
              f"{risk_probability:.4f}"
          )

          print(
              f"Risk level: {risk_level}"
          )

          print(
              "Prediction PASSED."
          )

          # ==================================================
          # STEP 3: SHAP EXPLANATION
          # ==================================================

          print(
              "\n[3/3] Testing SHAP explanation..."
          )

          response = requests.post(
              f"{API_URL}/explain",
              json={
                  "patient": patient
              },
              timeout=180
          )

          response.raise_for_status()

          explanation = response.json()

          print(
              "SHAP response received."
          )

          risk_factors = explanation.get(
              "risk_factors"
          )

          protective_factors = explanation.get(
              "protective_factors"
          )

          if risk_factors is None:
              print(
                  "\nERROR: risk_factors missing."
              )

              print("Response:")
              print(explanation)

              sys.exit(1)

          if protective_factors is None:
              print(
                  "\nERROR: protective_factors missing."
              )

              print("Response:")
              print(explanation)

              sys.exit(1)

          print(
              "Risk factors:",
              len(risk_factors)
          )

          print(
              "Protective factors:",
              len(protective_factors)
          )

          print(
              "SHAP explanation PASSED."
          )

          # ==================================================
          # FINAL RESULT
          # ==================================================

          print("\n" + "=" * 60)
          print("CARE PREDICT SYSTEM TEST PASSED")
          print("=" * 60)

          print("Health check : PASS")
          print("OCR          : PASS")
          print("Prediction   : PASS")
          print("SHAP         : PASS")

          print("=" * 60)

          PY
